    <!-- 3D logic (Three.js) -->
    <script>
        // Players (colours, numbers and height are illustrative). Base accuracy is replaced on load
        // with the real season value (data/players.json); fatigue comes from the population model (data/summary.json).
        const PLAYERS_DATA = {
            Curry: {
                name: "Stephen Curry", team: "GSW", number: "30",
                jerseyColor: 0x1D428A, trimColor: 0xFFC72C, shortsColor: 0x1D428A,
                skinColor: 0xE0A96D, hairColor: 0x271910, heightScale: 0.94,
                baseFg: 48.5
            },
            Tatum: {
                name: "Jayson Tatum", team: "BOS", number: "0",
                jerseyColor: 0x007A33, trimColor: 0xFFFFFF, shortsColor: 0x007A33,
                skinColor: 0xB57B48, hairColor: 0x1A110B, heightScale: 1.01,
                baseFg: 46.8
            },
            LeBron: {
                name: "LeBron James", team: "LAL", number: "23",
                jerseyColor: 0x552583, trimColor: 0xFDB927, shortsColor: 0x552583,
                skinColor: 0x8D5524, hairColor: 0x1A110B, heightScale: 1.03,
                baseFg: 53.2
            },
            Doncic: {
                name: "Luka Dončić", team: "DAL", number: "77",
                jerseyColor: 0x00538C, trimColor: 0xB8C4CA, shortsColor: 0x00538C,
                skinColor: 0xF1C27D, hairColor: 0x5C4033, heightScale: 1.00,
                baseFg: 48.7
            },
            Young: {
                name: "Trae Young", team: "ATL", number: "11",
                jerseyColor: 0xC8102E, trimColor: 0xFDB927, shortsColor: 0xC8102E,
                skinColor: 0xC68642, hairColor: 0x2A1D15, heightScale: 0.92,
                baseFg: 42.5
            },
            Jokic: {
                name: "Nikola Jokić", team: "DEN", number: "15",
                jerseyColor: 0x0E2240, trimColor: 0xFEC524, shortsColor: 0x0E2240,
                skinColor: 0xFCD0A1, hairColor: 0x4A3728, heightScale: 1.05,
                baseFg: 58.3
            }
        };

        // Fatigue model: MEASURED population slope (accuracy pp per consecutive minute), not per player.
        const FATIGUE_MODEL = { central: 0.0, pessimistic: 0.0, scenario: 'central', loaded: false, mu_ci: null };
        function fatigueSlope() { return FATIGUE_MODEL[FATIGUE_MODEL.scenario]; }
        function fatigueDropFor(stintMin) {
            // drop (pp) relative to 4 consecutive min; negative if the model measures an improvement
            return stintMin > 4.0 ? -fatigueSlope() * (stintMin - 4.0) : 0;
        }
        const norm = (t) => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        async function loadRealData() {
            try {
                const [sum, pl] = await Promise.all([
                    fetch('../data/summary.json').then((r) => r.json()),
                    fetch('../data/players.json').then((r) => r.json())
                ]);
                // Fatigue = slope per consecutive minute AFTER warm-up (from 2 min); the cold start is separate
                const warm = sum.robustness.find((r) => r.label.startsWith('Warmed up only'));
                FATIGUE_MODEL.central = warm.coef_pp;
                // Pessimistic scenario: lower bound of the 95% CI of that slope (0 if the CI does not go below zero)
                FATIGUE_MODEL.pessimistic = Math.min(0, warm.lo_pp);
                FATIGUE_MODEL.mu_ci = [warm.lo_pp, warm.hi_pp];
                const cs = (lab) => (sum.cold_start.find((r) => r.label === lab) || {}).effect_pp || 0;
                DEF.cold = [{ hi: 0.5, eff: cs('0–30 s') }, { hi: 1.0, eff: cs('30–60 s') }, { hi: 2.0, eff: cs('1–2 min') }];
                Object.values(PLAYERS_DATA).forEach((p) => {
                    const hit = pl.find((x) => norm(x.name) === norm(p.name));
                    if (hit) { p.baseFg = hit.fg * 100; p.real = true; }
                });
                FATIGUE_MODEL.loaded = true;
            } catch (e) { /* no local server: stays at 0 (no effect) */ }
            const sel = document.getElementById('fatigue-scenario');
            if (sel) sel.addEventListener('change', () => { FATIGUE_MODEL.scenario = sel.value; onStintSliderChange(document.getElementById('slider-stint').value); });
            updateFatigueNote();
            onStintSliderChange(document.getElementById('slider-stint').value);
        }
        function updateFatigueNote() {
            const note = document.getElementById('fatigue-note');
            if (!note) return;
            note.textContent = FATIGUE_MODEL.loaded
                ? I18N.t('sim.fat.note', { x: (fatigueSlope() >= 0 ? '+' : '') + fatigueSlope().toFixed(3) })
                : I18N.t('sim.nodata');
        }

// <<DEFENSA
        // Every accuracy term comes from measured data (see data/*.json). Nothing is hand-written.
        const FT = 0.3048;
        const DEF = { teams: [], team: null, contest: null, dist: null, season: null, mainDef: 4.0, cold: [], auto: true };
        const TEAM_COLORS = { Hawks: 0xE03A3E, Celtics: 0x007A33, Nets: 0x2B2B2B, Hornets: 0x1D1160, Bulls: 0xCE1141, Cavaliers: 0x860038,
            Mavericks: 0x00538C, Nuggets: 0x0E2240, Pistons: 0xC8102E, Warriors: 0x1D428A, Rockets: 0xCE1141, Pacers: 0x002D62,
            Clippers: 0xC8102E, Lakers: 0x552583, Grizzlies: 0x5D76A9, Heat: 0x98002E, Bucks: 0x00471B, Timberwolves: 0x0C2340,
            Pelicans: 0x0C2340, Knicks: 0x006BB6, Thunder: 0x007AC1, Magic: 0x0077C0, '76ers': 0x006BB6, Suns: 0x1D1160,
            'Trail Blazers': 0xE03A3E, Kings: 0x5A2D81, Spurs: 0x8A8D8F, Raptors: 0xCE1141, Jazz: 0x002B5C, Wizards: 0x002B5C };
        function teamColor(name) {
            for (const k in TEAM_COLORS) { if (String(name).endsWith(k)) return TEAM_COLORS[k]; }
            return 0x64748B;
        }
        // Fractional position inside a sorted grid
        function interpIdx(grid, x) {
            const n = grid.length;
            if (x <= grid[0]) return { i: 0, j: 0, t: 0 };
            if (x >= grid[n - 1]) return { i: n - 1, j: n - 1, t: 0 };
            let i = 0;
            while (grid[i + 1] < x) i++;
            return { i, j: i + 1, t: (x - grid[i]) / (grid[i + 1] - grid[i]) };
        }
        function bilinear(table, shotGrid, defGrid, shotFt, defFt) {
            const a = interpIdx(shotGrid, shotFt), b = interpIdx(defGrid, defFt);
            const top = table[a.i][b.i] * (1 - b.t) + table[a.i][b.j] * b.t;
            const bot = table[a.j][b.i] * (1 - b.t) + table[a.j][b.j] * b.t;
            return top * (1 - a.t) + bot * a.t;
        }
        // Accuracy by shot distance, relative to the league average (our 4 seasons)
        function distAdj(ft) {
            if (!DEF.dist) return 0;
            const a = DEF.dist.adj_pp, x = Math.max(0, Math.min(40, ft)), i = Math.floor(x), t = x - i;
            return a[i] * (1 - t) + a[Math.min(40, i + 1)] * t;
        }
        // TYPICAL defender distance for a shot distance (2014-15 median): the defender adjustment is 0 there
        function typicalDef(shotFt) {
            const c = DEF.contest;
            if (!c || !c.ref_def_by_shot_ft) return 4.0;
            const a = interpIdx(c.shot_grid_ft, shotFt), r = c.ref_def_by_shot_ft;
            return r[a.i] * (1 - a.t) + r[a.j] * a.t;
        }
        // Effect of the nearest defender's distance, relative to the typical distance for that shot type (NBA 2014-15 data)
        function contestAdj(shotFt, defFt) {
            const c = DEF.contest;
            if (!c) return { adj: 0, lo: 0, hi: 0 };
            const f = (tab) => bilinear(tab, c.shot_grid_ft, c.def_grid_ft, shotFt, defFt);
            return { adj: f(c.adj_pp), lo: f(c.adj_lo_pp), hi: f(c.adj_hi_pp) };
        }
        // Average defensive effect of the rival team (latest season, shrunk)
        function teamAdj() {
            return DEF.team ? { adj: DEF.team.effect_pp, lo: DEF.team.lo_pp, hi: DEF.team.hi_pp } : { adj: 0, lo: 0, hi: 0 };
        }
        // Cold start: accuracy relative to the player's normal by time since entering (measured)
        function coldAdj(stintMin) {
            for (const b of DEF.cold) { if (stintMin < b.hi) return b.eff; }
            return 0;
        }
        function computeShotProb() {
            const stintMin = parseFloat(document.getElementById('slider-stint').value);
            const pData = PLAYERS_DATA[activePlayerKey];
            const dx = currentShooterPos.x - HOOP_X, dz = currentShooterPos.z - HOOP_Z;
            const distFeet = Math.sqrt(dx * dx + dz * dz) * 3.28084;
            const da = distAdj(distFeet), ca = contestAdj(distFeet, DEF.mainDef), ta = teamAdj();
            const fatigueDrop = stintMin > 4.0 ? fatigueDropFor(stintMin) : 0;
            const cold = coldAdj(stintMin);
            const final = Math.max(2, Math.min(98, pData.baseFg + da + ca.adj + ta.adj + cold - fatigueDrop));
            return { final, base: pData.baseFg, da, ca, ta, cold, fatigueDrop, distFeet, typ: typicalDef(distFeet) };
        }

        // ----- 3D defenders (illustrative positions; only the main one has an effect through its distance) -----
        let defendersGroup = null;
        function makeDefender(jerseyHex, alpha) {
            const g = new THREE.Group();
            const mk = (color, rough) => new THREE.MeshStandardMaterial({ color, roughness: rough, transparent: alpha < 1, opacity: alpha });
            const jersey = mk(jerseyHex, 0.55), skin = mk(0x8D5524, 0.6), shoes = mk(0xF8FAFC, 0.4);
            [-1, 1].forEach((s) => {
                const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.055, 0.85, 12), skin);
                leg.position.set(s * 0.11, 0.46, 0); leg.castShadow = true; g.add(leg);
                const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.07, 0.26), shoes);
                shoe.position.set(s * 0.11, 0.04, 0.04); g.add(shoe);
                const arm = new THREE.Group();                       // arms up: defensive stance
                arm.position.set(s * 0.27, 1.55, 0);
                const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.04, 0.62, 10), skin);
                seg.position.y = 0.31; arm.add(seg);
                arm.rotation.z = -s * 0.3; arm.rotation.x = 1.15;
                g.add(arm);
            });
            const shorts = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.22, 0.3, 20), jersey);
            shorts.scale.z = 0.7; shorts.position.y = 0.98; shorts.castShadow = true; g.add(shorts);
            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.235, 0.2, 0.56, 24), jersey);
            torso.scale.z = 0.62; torso.position.y = 1.37; torso.castShadow = true; g.add(torso);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.115, 20, 20), skin);
            head.scale.set(0.92, 1.1, 1.0); head.position.y = 1.83; g.add(head);
            return g;
        }
        function buildDefenders() {
            if (defendersGroup) { scene.remove(defendersGroup); }
            const wasVisible = defendersGroup ? defendersGroup.visible : true;
            defendersGroup = new THREE.Group();
            const color = DEF.team ? teamColor(DEF.team.team) : 0x64748B;
            for (let k = 0; k < 5; k++) { defendersGroup.add(makeDefender(color, k === 0 ? 1.0 : 0.55)); }
            defendersGroup.visible = wasVisible;
            scene.add(defendersGroup);
        }
        const GHOST_SPOTS = [[-3.0, -2.2], [3.1, -2.6], [-1.3, -4.4], [1.5, -1.0], [-4.8, 0.6], [4.6, 1.3], [0.0, 3.8]];
        function syncTypicalDefender() {
            if (!DEF.auto || !DEF.contest) return;
            const dx = currentShooterPos.x - HOOP_X, dz = currentShooterPos.z - HOOP_Z;
            const typ = typicalDef(Math.sqrt(dx * dx + dz * dz) * 3.28084);
            DEF.mainDef = Math.max(1.5, Math.min(8, Math.round(typ * 2) / 2));
            const sl = document.getElementById('slider-def'), lb = document.getElementById('slider-def-val');
            if (sl) sl.value = DEF.mainDef;
            if (lb) lb.textContent = `${DEF.mainDef.toFixed(1)} ft`;
        }
        const DEF_SHADE = 0.38;   // the defender shifts ~22° off the shooter-hoop line, as in real defense
        function placeDefenders() {
            if (!defendersGroup) return;
            syncTypicalDefender();
            const sx = currentShooterPos.x, sz = currentShooterPos.z;
            let vx = HOOP_X - sx, vz = HOOP_Z - sz;
            const dist = Math.hypot(vx, vz) || 1;
            vx /= dist; vz /= dist;
            const d = Math.min(DEF.mainDef * FT, Math.max(0.46, dist - 0.3));   // center-to-center distance, never crossing the hoop
            const c = Math.cos(DEF_SHADE), sn = Math.sin(DEF_SHADE);
            const ux = vx * c - vz * sn, uz = vx * sn + vz * c;                 // rotated direction
            const main = defendersGroup.children[0];
            main.position.set(sx + ux * d, 0, sz + uz * d);
            main.lookAt(sx, 0, sz);
            const free = GHOST_SPOTS.filter(([x, z]) => Math.hypot(x - sx, z - sz) > 1.8 && Math.hypot(x - main.position.x, z - main.position.z) > 1.5);
            for (let k = 1; k < 5; k++) {
                const [x, z] = free[k - 1] || GHOST_SPOTS[k];
                defendersGroup.children[k].position.set(x, 0, z);
                defendersGroup.children[k].lookAt(sx, 0, sz);
            }
        }
        function toggleDefenders(on) { if (defendersGroup) defendersGroup.visible = on; }
        function onTypicalToggled(on) {
            DEF.auto = on;
            placeDefenders();
            updatePredictiveStats();
        }
        function onDefenderChanged(v) {
            DEF.auto = false;                                   // the user sets the distance
            const chk = document.getElementById('chk-typical'); if (chk) chk.checked = false;
            DEF.mainDef = parseFloat(v);
            document.getElementById('slider-def-val').textContent = `${DEF.mainDef.toFixed(1)} ft`;
            placeDefenders();
            updatePredictiveStats();
        }
        function onRivalChanged() {
            const id = document.getElementById('select-rival').value;
            DEF.team = DEF.teams.find((t) => String(t.team_id) === id) || null;
            buildDefenders(); placeDefenders();
            updatePredictiveStats();
        }
        async function loadDefenseData() {
            try {
                const [d, c, dist] = await Promise.all([
                    fetch('../data/defense.json').then((r) => r.json()),
                    fetch('../data/contest.json').then((r) => r.json()),
                    fetch('../data/distance.json').then((r) => r.json())
                ]);
                DEF.teams = d.teams; DEF.contest = c; DEF.dist = dist; DEF.season = d.season;
                const sel = document.getElementById('select-rival');
                d.teams.slice().sort((a, b) => a.team.localeCompare(b.team)).forEach((t) => {
                    const o = document.createElement('option'); o.value = t.team_id; o.textContent = t.team; sel.appendChild(o);
                });
            } catch (e) { /* no defense data: adjustments stay at 0 */ }
            if (typeof placeDefenders === 'function') placeDefenders();     // apply the typical distance now that the data is loaded
            if (typeof updateArcPreview === 'function') updateArcPreview();
            updateDefNote();
            updatePredictiveStats();
        }
        function updateDefNote() {
            const note = document.getElementById('def-note');
            if (!note) return;
            note.textContent = DEF.contest
                ? I18N.t('sim.def.note', { s: `${DEF.season}-${String(+DEF.season + 1).slice(2)}` })
                : I18N.t('sim.def.nodata');
        }
        // DEFENSA>>

        // Predefined shot spots
        const SHOT_ZONES = {
            top3: { x: 0, z: 2.2 },
            corner3_r: { x: 6.2, z: -5.0 },
            corner3_l: { x: -6.2, z: -5.0 },
            wing3: { x: 4.8, z: -0.5 },
            midrange: { x: -3.5, z: -1.0 },
            freethrow: { x: 0, z: -0.9 },
            paint: { x: 0.6, z: -3.4 }
        };

        // Three.js Core
        let scene, camera, renderer, controls;
        let basketball, playerGroup, hoopMesh, netMesh;
        let courtFloorMesh, targetRingMesh;
        let isShooting = false;
        let cameraModeIndex = 0;

        // Official NBA hoop coordinates (meters)
        const HOOP_X = 0;
        const HOOP_Y = 3.05; // 10 ft
        const HOOP_Z = -5.5; 
        const RIM_RADIUS = 0.23;

        // Current shooter position (meters)
        let currentShooterPos = { x: 0, z: 2.2 };
        let activePlayerKey = "Curry";

        // References for joints and animation
        let bodyGroup, rightArm, leftArm, rightLeg, leftLeg, headMesh, jerseyMesh, shortsMesh;
        let ballInHands = true;

        // 1. Scene initialisation
        function initScene() {
            const canvas = document.getElementById('webgl-canvas');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x080B12);
            scene.fog = new THREE.FogExp2(0x080B12, 0.022);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 8.5, 12.0);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.02;
            controls.minDistance = 3;
            controls.maxDistance = 25;
            controls.target.set(0, 2.0, -1.8);

            setupLights();
            createBasketballCourt();
            createHoop();
            createTargetRing();
            buildAthleticPlayer();
            createBasketball();
            initArcObjects();
            buildDefenders();

            // Interaction: click on the court to place the player
            initCourtRaycasting();
            initDraggableCards();

            window.addEventListener('resize', onWindowResize, false);
            updateShooterPosition(currentShooterPos.x, currentShooterPos.z);
            updatePredictiveStats();
            applySideCamera(0);
        }

        // Lighting
        function setupLights() {
            const ambient = new THREE.AmbientLight(0xffffff, 0.65);
            scene.add(ambient);

            const spotAboveHoop = new THREE.SpotLight(0xffffff, 1.5);
            spotAboveHoop.position.set(0, 12, -4);
            spotAboveHoop.angle = Math.PI / 3;
            spotAboveHoop.penumbra = 0.6;
            spotAboveHoop.castShadow = true;
            scene.add(spotAboveHoop);

            const stadiumLight1 = new THREE.DirectionalLight(0x38BDF8, 0.5);
            stadiumLight1.position.set(10, 10, 8);
            scene.add(stadiumLight1);

            const stadiumLight2 = new THREE.DirectionalLight(0x818CF8, 0.4);
            stadiumLight2.position.set(-10, 10, 8);
            scene.add(stadiumLight2);
        }

        // Wooden court
        function createBasketballCourt() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = "#B45309";
            ctx.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 512; i += 32) {
                ctx.fillStyle = i % 64 === 0 ? "#9A3412" : "#B45309";
                ctx.fillRect(0, i, 512, 30);
                ctx.fillStyle = "#78350F";
                ctx.fillRect(0, i + 30, 512, 2);
            }

            const floorTexture = new THREE.CanvasTexture(canvas);
            floorTexture.wrapS = THREE.RepeatWrapping;
            floorTexture.wrapT = THREE.RepeatWrapping;
            floorTexture.repeat.set(4, 4);

            const floorMaterial = new THREE.MeshStandardMaterial({
                map: floorTexture,
                roughness: 0.35,
                metalness: 0.1
            });

            const floorGeo = new THREE.PlaneGeometry(16, 16);
            courtFloorMesh = new THREE.Mesh(floorGeo, floorMaterial);
            courtFloorMesh.rotation.x = -Math.PI / 2;
            courtFloorMesh.position.set(0, 0, -1);
            courtFloorMesh.receiveShadow = true;
            scene.add(courtFloorMesh);

            createCourtMarkings();
        }

        function createCourtMarkings() {
            const lineMat = new THREE.LineBasicMaterial({ color: 0xFFFFFF, linewidth: 2 });
            const paintMat = new THREE.MeshBasicMaterial({ color: 0x1E3A8A, opacity: 0.7, transparent: true });

            // Painted area
            const paintGeo = new THREE.PlaneGeometry(4.8, 5.8);
            const paint = new THREE.Mesh(paintGeo, paintMat);
            paint.rotation.x = -Math.PI / 2;
            paint.position.set(0, 0.005, -3.9);
            scene.add(paint);

            // Three-point line
            const points3pt = [];
            const radius3pt = 6.8;
            for (let i = 0; i <= 64; i++) {
                const theta = (i / 64) * Math.PI;
                const x = radius3pt * Math.cos(theta);
                const z = -radius3pt * Math.sin(theta) + 1.2;
                if (z > -5.5 && Math.abs(x) <= 6.5) {
                    points3pt.push(new THREE.Vector3(x, 0.01, z));
                }
            }
            const geo3pt = new THREE.BufferGeometry().setFromPoints(points3pt);
            const line3pt = new THREE.Line(geo3pt, lineMat);
            scene.add(line3pt);
        }

        // Floor ring marking where the player stands
        function createTargetRing() {
            const ringGeo = new THREE.RingGeometry(0.35, 0.45, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x38BDF8, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
            targetRingMesh = new THREE.Mesh(ringGeo, ringMat);
            targetRingMesh.rotation.x = -Math.PI / 2;
            targetRingMesh.position.set(0, 0.02, 0);
            scene.add(targetRingMesh);
        }

        // Backboard and hoop
        function createHoop() {
            const hoopGroup = new THREE.Group();

            const poleGeo = new THREE.CylinderGeometry(0.12, 0.12, 4.2, 16);
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x1E293B, metalness: 0.8, roughness: 0.2 });
            const pole = new THREE.Mesh(poleGeo, poleMat);
            pole.position.set(0, 2.1, -6.8);
            pole.castShadow = true;
            hoopGroup.add(pole);

            const armGeo = new THREE.BoxGeometry(0.12, 0.12, 1.4);
            const arm = new THREE.Mesh(armGeo, poleMat);
            arm.position.set(0, 3.3, -6.1);
            hoopGroup.add(arm);

            const boardGeo = new THREE.BoxGeometry(1.8, 1.05, 0.04);
            const boardMat = new THREE.MeshPhysicalMaterial({
                color: 0xFFFFFF,
                transparent: true,
                opacity: 0.45,
                roughness: 0.1,
                transmission: 0.9,
                thickness: 0.5
            });
            const board = new THREE.Mesh(boardGeo, boardMat);
            board.position.set(0, 3.3, -5.85);
            hoopGroup.add(board);

            const squareGeo = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-0.3, -0.22, 0.03),
                new THREE.Vector3(0.3, -0.22, 0.03),
                new THREE.Vector3(0.3, 0.22, 0.03),
                new THREE.Vector3(-0.3, 0.22, 0.03),
                new THREE.Vector3(-0.3, -0.22, 0.03)
            ]);
            const squareLine = new THREE.Line(squareGeo, new THREE.LineBasicMaterial({ color: 0xFFFFFF, linewidth: 2 }));
            squareLine.position.set(0, 3.2, -5.85);
            hoopGroup.add(squareLine);

            const rimGeo = new THREE.TorusGeometry(RIM_RADIUS, 0.018, 16, 32);
            const rimMat = new THREE.MeshStandardMaterial({ color: 0xF97316, metalness: 0.6, roughness: 0.3 });
            const rim = new THREE.Mesh(rimGeo, rimMat);
            rim.rotation.x = Math.PI / 2;
            rim.position.set(HOOP_X, HOOP_Y, HOOP_Z);
            hoopGroup.add(rim);

            const netGeo = new THREE.CylinderGeometry(RIM_RADIUS, 0.14, 0.45, 16, 4, true);
            const netMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF, wireframe: true, transparent: true, opacity: 0.8 });
            netMesh = new THREE.Mesh(netGeo, netMat);
            netMesh.position.set(HOOP_X, HOOP_Y - 0.22, HOOP_Z);
            hoopGroup.add(netMesh);

            scene.add(hoopGroup);
            hoopMesh = hoopGroup;
        }

        // =========================================================================
        // 2. PLAYER MODEL (ARTICULATED SKELETON, UNIFORM, NUMBER)
        // =========================================================================

        // Skeleton measures in meters (before scaling by height)
        const UPPER_ARM = 0.30, FOREARM = 0.27, THIGH = 0.45, SHIN = 0.45;
        const HIP_Y = 0.95, SHOULDER_Y = 1.58, ANKLE_Y = 0.1;
        const IDLE_CROUCH = 0.04;

        // Ball in the player's local coordinates (+Z faces the hoop)
        const BALL_HOLD = new THREE.Vector3(0.1, 1.25, 0.32);      // Triple threat
        const BALL_SET_POINT = new THREE.Vector3(0.1, 2.02, 0.3);  // Set above the right eye

        // Wrist position relative to the ball and the direction the elbow points
        const RIGHT_HAND_HOLD = new THREE.Vector3(0.1, 0.0, -0.08);
        const RIGHT_HAND_SET = new THREE.Vector3(0.0, -0.15, -0.05);
        const LEFT_HAND_HOLD = new THREE.Vector3(-0.13, 0.02, -0.02);
        const LEFT_HAND_SET = new THREE.Vector3(-0.15, -0.02, -0.02);
        const ELBOW_POLE_R_HOLD = new THREE.Vector3(1, 0, -1);
        const ELBOW_POLE_R_SET = new THREE.Vector3(0.2, -1, 0.4);
        const ELBOW_POLE_L_HOLD = new THREE.Vector3(-1, 0, -1);
        const ELBOW_POLE_L_SET = new THREE.Vector3(-1, -0.4, 0);
        const KNEE_POLE = new THREE.Vector3(0, 0, 1);
        const DOWN = new THREE.Vector3(0, -1, 0);

        const hexColor = (c) => '#' + c.toString(16).padStart(6, '0');

        // Sleeveless jersey texture. On a CylinderGeometry u=0 is the front (+Z)
        // and u=0.5 the back, so the large number goes at the canvas centre and the
        // front one is drawn split across both edges so it joins at the seam.
        function createJerseyTexture(pData) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const trim = hexColor(pData.trimColor);

            ctx.fillStyle = hexColor(pData.jerseyColor);
            ctx.fillRect(0, 0, 512, 256);

            // Neck/armhole trim, jersey hem and side panels
            ctx.fillStyle = trim;
            ctx.fillRect(0, 0, 512, 10);
            ctx.fillRect(0, 244, 512, 12);
            ctx.fillRect(117, 0, 22, 256);
            ctx.fillRect(373, 0, 22, 256);

            ctx.textAlign = 'center';
            ctx.lineWidth = 5;
            ctx.strokeStyle = '#FFFFFF';

            // Back: surname + large number
            const lastName = pData.name.split(' ').slice(-1)[0].toUpperCase();
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 30px Outfit, sans-serif';
            ctx.fillText(lastName, 256, 58);
            ctx.fillStyle = trim;
            ctx.font = 'bold 120px Orbitron, sans-serif';
            ctx.strokeText(pData.number, 256, 190);
            ctx.fillText(pData.number, 256, 190);

            // Front: franchise + medium number
            [0, 512].forEach(x => {
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 34px Outfit, sans-serif';
                ctx.fillText(pData.team, x, 70);
                ctx.fillStyle = trim;
                ctx.font = 'bold 80px Orbitron, sans-serif';
                ctx.strokeText(pData.number, x, 165);
                ctx.fillText(pData.number, x, 165);
            });

            const texture = new THREE.CanvasTexture(canvas);
            texture.anisotropy = 4;
            return texture;
        }

        // Cylindrical segment hanging toward -Y from its joint
        function makeSegment(rTop, rBottom, length, mat) {
            const geo = new THREE.CylinderGeometry(rTop, rBottom, length, 14);
            geo.translate(0, -length / 2, 0);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            return mesh;
        }

        // Two-bone limb: root (shoulder/hip) -> mid (elbow/knee) -> end (wrist/ankle)
        function makeLimb(parent, origin, len1, len2) {
            const root = new THREE.Group();
            root.position.copy(origin);
            const mid = new THREE.Group();
            mid.position.y = -len1;
            const end = new THREE.Group();
            end.position.y = -len2;
            root.add(mid);
            mid.add(end);
            parent.add(root);
            return { root, mid, end, len1, len2 };
        }

        // Analytic two-bone IK: brings the end to `target` (parent coordinates)
        // bending the middle joint toward `pole`.
        function solveLimb(limb, target, pole) {
            const toTarget = target.clone().sub(limb.root.position);
            const dist = THREE.MathUtils.clamp(toTarget.length(), 0.05, limb.len1 + limb.len2 - 0.001);
            const dir = toTarget.normalize();
            const bend = pole.clone().sub(dir.clone().multiplyScalar(pole.dot(dir))).normalize();
            const cosA = (limb.len1 ** 2 + dist ** 2 - limb.len2 ** 2) / (2 * limb.len1 * dist);
            const a = Math.acos(THREE.MathUtils.clamp(cosA, -1, 1));

            const midPos = dir.clone().multiplyScalar(Math.cos(a) * limb.len1)
                .add(bend.multiplyScalar(Math.sin(a) * limb.len1));
            const lowerDir = dir.multiplyScalar(dist).sub(midPos).normalize();

            limb.root.quaternion.setFromUnitVectors(DOWN, midPos.normalize());
            const lowerQuat = new THREE.Quaternion().setFromUnitVectors(DOWN, lowerDir);
            limb.mid.quaternion.copy(limb.root.quaternion).invert().multiply(lowerQuat);
        }

        function buildAthleticPlayer() {
            if (playerGroup) {
                scene.remove(playerGroup);
            }

            const pData = PLAYERS_DATA[activePlayerKey];
            playerGroup = new THREE.Group();
            // Everything from the hip up goes down together when the knees bend
            bodyGroup = new THREE.Group();
            playerGroup.add(bodyGroup);

            const skinMat = new THREE.MeshStandardMaterial({ color: pData.skinColor, roughness: 0.6 });
            const hairMat = new THREE.MeshStandardMaterial({ color: pData.hairColor, roughness: 0.9 });
            const shortsMat = new THREE.MeshStandardMaterial({ color: pData.shortsColor, roughness: 0.55 });
            const trimMat = new THREE.MeshStandardMaterial({ color: pData.trimColor, roughness: 0.5 });
            const shoesMat = new THREE.MeshStandardMaterial({ color: 0xF8FAFC, roughness: 0.35 });
            const soleMat = new THREE.MeshStandardMaterial({ color: 0x1E293B, roughness: 0.7 });
            const socksMat = new THREE.MeshStandardMaterial({ color: 0xF1F5F9, roughness: 0.85 });
            const jerseyMat = new THREE.MeshStandardMaterial({ map: createJerseyTexture(pData), roughness: 0.55 });

            // 1. Head, neck, hair, ears and nose (the nose shows where it faces)
            const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.065, 0.12, 14), skinMat);
            neck.position.y = 1.68;
            bodyGroup.add(neck);

            headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.115, 24, 24), skinMat);
            headMesh.scale.set(0.92, 1.1, 1.0);
            headMesh.position.y = 1.83;
            headMesh.castShadow = true;
            bodyGroup.add(headMesh);

            const hair = new THREE.Mesh(new THREE.SphereGeometry(0.119, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2.3), hairMat);
            hair.scale.set(0.92, 1.1, 1.0);
            hair.position.y = 1.845;
            hair.rotation.x = -0.35;
            bodyGroup.add(hair);

            [-1, 1].forEach(side => {
                const ear = new THREE.Mesh(new THREE.SphereGeometry(0.026, 10, 10), skinMat);
                ear.scale.set(0.5, 1, 0.8);
                ear.position.set(side * 0.105, 1.82, 0);
                bodyGroup.add(ear);
            });

            const nose = new THREE.Mesh(new THREE.SphereGeometry(0.022, 10, 10), skinMat);
            nose.position.set(0, 1.815, 0.112);
            bodyGroup.add(nose);

            // 2. Torso: sleeveless jersey flattened front to back
            jerseyMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.235, 0.2, 0.56, 28), jerseyMat);
            jerseyMesh.scale.z = 0.62;
            jerseyMesh.position.y = 1.36;
            jerseyMesh.castShadow = true;
            bodyGroup.add(jerseyMesh);

            // 3. Waistband in the accent colour
            shortsMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.205, 0.215, 0.2, 24), shortsMat);
            shortsMesh.scale.z = 0.7;
            shortsMesh.position.y = 1.0;
            shortsMesh.castShadow = true;
            bodyGroup.add(shortsMesh);

            const waistband = new THREE.Mesh(new THREE.CylinderGeometry(0.208, 0.208, 0.035, 24), trimMat);
            waistband.scale.z = 0.7;
            waistband.position.y = 1.085;
            bodyGroup.add(waistband);

            // 4. Legs: baggy knee-length shorts, high sock and high-top sneaker
            const buildLeg = (side) => {
                const leg = makeLimb(bodyGroup, new THREE.Vector3(side * 0.11, HIP_Y, 0), THIGH, SHIN);

                leg.root.add(makeSegment(0.085, 0.07, THIGH, skinMat));
                leg.root.add(makeSegment(0.125, 0.115, 0.4, shortsMat));
                const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.38, 0.05), trimMat);
                stripe.position.set(side * 0.118, -0.2, 0);
                leg.root.add(stripe);

                leg.mid.add(new THREE.Mesh(new THREE.SphereGeometry(0.068, 12, 12), skinMat));
                leg.mid.add(makeSegment(0.068, 0.05, SHIN, skinMat));
                const sock = new THREE.Mesh(new THREE.CylinderGeometry(0.058, 0.056, 0.22, 14), socksMat);
                sock.position.y = -SHIN + 0.11;
                leg.mid.add(sock);

                const sole = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.035, 0.3), soleMat);
                sole.position.set(0, -ANKLE_Y + 0.0175, 0.05);
                const upper = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.1, 0.26), shoesMat);
                upper.position.set(0, -0.015, 0.04);
                const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.062, 0.062, 0.07, 14), shoesMat);
                collar.position.y = 0.04;
                const swoosh = new THREE.Mesh(new THREE.BoxGeometry(0.114, 0.025, 0.18), trimMat);
                swoosh.position.set(0, -0.02, 0.05);
                [sole, upper, collar, swoosh].forEach(m => { m.castShadow = true; leg.end.add(m); });

                return leg;
            };
            rightLeg = buildLeg(1);
            leftLeg = buildLeg(-1);

            // 5. Arms: deltoid, elbow, wristband on the shooting arm and hand
            const buildArm = (side) => {
                const shoulder = new THREE.Mesh(new THREE.SphereGeometry(0.075, 14, 14), skinMat);
                shoulder.position.set(side * 0.25, SHOULDER_Y + 0.02, 0);
                bodyGroup.add(shoulder);

                const arm = makeLimb(bodyGroup, new THREE.Vector3(side * 0.27, SHOULDER_Y, 0), UPPER_ARM, FOREARM);
                arm.root.add(makeSegment(0.058, 0.048, UPPER_ARM, skinMat));
                arm.mid.add(new THREE.Mesh(new THREE.SphereGeometry(0.048, 12, 12), skinMat));
                arm.mid.add(makeSegment(0.048, 0.038, FOREARM, skinMat));
                if (side === 1) {
                    const wristband = new THREE.Mesh(new THREE.CylinderGeometry(0.044, 0.042, 0.06, 14), trimMat);
                    wristband.position.y = -FOREARM + 0.05;
                    arm.mid.add(wristband);
                }
                const hand = new THREE.Mesh(new THREE.SphereGeometry(0.048, 12, 12), skinMat);
                hand.scale.set(0.85, 1.35, 0.55);
                hand.position.y = -0.06;
                arm.end.add(hand);
                return arm;
            };
            rightArm = buildArm(1);
            leftArm = buildArm(-1);

            // Scale by the player's real height
            playerGroup.scale.set(pData.heightScale, pData.heightScale, pData.heightScale);

            posePlayer(IDLE_CROUCH, 0);

            scene.add(playerGroup);
        }

        // Full player pose.
        //   crouch: how far the hip drops (feet stay on the floor)
        //   lift:   0 = ball in triple threat, 1 = ball at the shot set point
        // While the ball is in the hands it places it; after release it does the follow-through.
        function posePlayer(crouch = IDLE_CROUCH, lift = 0) {
            bodyGroup.position.y = -crouch;

            [rightLeg, leftLeg].forEach(leg => {
                const ankle = new THREE.Vector3(leg.root.position.x * 1.15, ANKLE_Y + crouch, 0.02);
                solveLimb(leg, ankle, KNEE_POLE);
                // The sneaker stays flat on the floor even when the shin tilts
                leg.end.quaternion.copy(leg.root.quaternion).multiply(leg.mid.quaternion).invert();
            });

            if (ballInHands) {
                // The ball moves up and down with the body, so in body coordinates
                // it does not depend on crouch
                const ball = BALL_HOLD.clone().lerp(BALL_SET_POINT, lift);
                const target = ball.clone();
                solveLimb(rightArm, target.clone().add(RIGHT_HAND_HOLD.clone().lerp(RIGHT_HAND_SET, lift)),
                    ELBOW_POLE_R_HOLD.clone().lerp(ELBOW_POLE_R_SET, lift));
                solveLimb(leftArm, target.clone().add(LEFT_HAND_HOLD.clone().lerp(LEFT_HAND_SET, lift)),
                    ELBOW_POLE_L_HOLD.clone().lerp(ELBOW_POLE_L_SET, lift));

                if (basketball) {
                    ball.y -= crouch;
                    playerGroup.updateMatrixWorld(true);
                    basketball.position.copy(playerGroup.localToWorld(ball));
                }
            } else {
                // Follow-through: shooting arm extended toward the hoop, guide hand open at the side
                solveLimb(rightArm, new THREE.Vector3(0.12, SHOULDER_Y + 0.55, 0.34), ELBOW_POLE_R_SET);
                solveLimb(leftArm, new THREE.Vector3(-0.3, SHOULDER_Y + 0.3, 0.3), ELBOW_POLE_L_SET);
            }
        }

        // Basketball
        function createBasketball() {
            const ballGeo = new THREE.SphereGeometry(0.12, 24, 24);
            const ballMat = new THREE.MeshStandardMaterial({ color: 0xEA580C, roughness: 0.5, metalness: 0.1 });
            basketball = new THREE.Mesh(ballGeo, ballMat);
            basketball.castShadow = true;
            resetBallToPlayerHands();
            scene.add(basketball);
        }

        function resetBallToPlayerHands() {
            ballInHands = true;
            posePlayer(IDLE_CROUCH, 0);
            basketball.visible = true;
        }

        // =========================================================================
        // 3. FREE CHOICE OF SHOT SPOT (RAYCASTING ON COURT CLICK)
        // =========================================================================
        function initCourtRaycasting() {
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            window.addEventListener('pointerdown', (e) => {
                // If the click was on a panel or button, do not move the player
                if (e.target.closest('.floating-card') || e.target.closest('.camera-tools') || e.target.closest('.hud-header')) {
                    return;
                }
                if (isShooting) return;

                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(courtFloorMesh);

                if (intersects.length > 0) {
                    const pt = intersects[0].point;
                    // Clamp inside the playable half court
                    const clampedX = Math.max(-6.8, Math.min(6.8, pt.x));
                    const clampedZ = Math.max(-5.8, Math.min(6.0, pt.z));

                    updateShooterPosition(clampedX, clampedZ);
                }
            });
        }

        function updateShooterPosition(x, z) {
            currentShooterPos = { x, z };
            playerGroup.position.set(x, 0, z);
            playerGroup.lookAt(HOOP_X, 0, HOOP_Z);

            // Move the indicator ring
            targetRingMesh.position.set(x, 0.02, z);

            resetBallToPlayerHands();
            placeDefenders();
            updateArcPreview();

            // Distance to the hoop in feet (1 m ≈ 3.28084 ft)
            const dx = x - HOOP_X;
            const dz = z - HOOP_Z;
            const distMeters = Math.sqrt(dx * dx + dz * dz);
            const distFeet = Math.round(distMeters * 3.28084);

            document.getElementById('metric-distance').textContent = `${distFeet} ft`;
            updatePredictiveStats();
        }

        function onZoneSelectChanged() {
            const zoneKey = document.getElementById('select-shot-zone').value;
            const pos = SHOT_ZONES[zoneKey];
            if (pos) {
                updateShooterPosition(pos.x, pos.z);
                if (cameraModeIndex === 0) applySideCamera(450);
            }
        }

        function onPlayerChanged() {
            activePlayerKey = document.getElementById('select-player').value;
            buildAthleticPlayer();
            updateShooterPosition(currentShooterPos.x, currentShooterPos.z);
            updatePredictiveStats();
        }

        // Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'swish') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.35);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.35);
            } else if (type === 'clank') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.setValueAtTime(180, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'jump') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            }
        }

        // Full shot simulation and animation
        // <<TRAYECTORIA
        // Physical trajectory: parabola of a projectile thrown from the hand to the hoop.
        // Given the release point, the hoop and the launch angle, the initial speed comes from the equations of motion
        // (there is no hand-written "arc height" and it does not depend on fatigue).
        const G_ACC = 9.81;
        const FLIGHT_SLOWMO = 1.15;          // playback 15% slower than real so the parabola can be followed
        function launchModel(start, target) {
            const dxh = target.x - start.x, dzh = target.z - start.z;
            const D = Math.hypot(dxh, dzh) || 0.01, dy = target.y - start.y;
            // launch angle: higher on close shots (floaters), ~47° on long shots
            let th = THREE.MathUtils.degToRad(THREE.MathUtils.clamp(60 - D * 1.6, 46, 62));
            const denomAt = (a) => 2 * Math.cos(a) ** 2 * (D * Math.tan(a) - dy);
            let denom = denomAt(th);
            while (denom < 0.2 && th < 1.45) { th += 0.05; denom = denomAt(th); }
            const v = Math.sqrt(G_ACC * D * D / denom);
            const vh = v * Math.cos(th), vy = v * Math.sin(th), T = D / vh;
            const ux = dxh / D, uz = dzh / D;
            return {
                T, v, angleDeg: th * 180 / Math.PI,
                at: (t) => new THREE.Vector3(start.x + ux * vh * t, start.y + vy * t - 0.5 * G_ACC * t * t, start.z + uz * vh * t),
                vyAt: (t) => vy - G_ACC * t
            };
        }
        let arcPreview = null, arcDots = null, trailLine = null, trailDots = null;
        function initArcObjects() {
            arcPreview = new THREE.Line(new THREE.BufferGeometry(),
                new THREE.LineDashedMaterial({ color: 0x7EA4E6, dashSize: 0.18, gapSize: 0.12, transparent: true, opacity: 0.8 }));
            arcDots = new THREE.Points(new THREE.BufferGeometry(),
                new THREE.PointsMaterial({ color: 0xB9D0F5, size: 0.11, transparent: true, opacity: 0.9, sizeAttenuation: true }));
            trailLine = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xFFD27A, transparent: true, opacity: 0.95 }));
            trailDots = new THREE.Points(new THREE.BufferGeometry(),
                new THREE.PointsMaterial({ color: 0xFFD27A, size: 0.16, transparent: true, opacity: 0.95, sizeAttenuation: true }));
            [arcPreview, arcDots, trailLine, trailDots].forEach((o) => { o.frustumCulled = false; scene.add(o); });
            trailLine.visible = false; trailDots.visible = false;
        }
        function releasePoint() {
            const h = (PLAYERS_DATA[activePlayerKey] || {}).heightScale || 1;
            return new THREE.Vector3(currentShooterPos.x, 2.45 * h, currentShooterPos.z);
        }
        function updateArcPreview() {
            if (!arcPreview) return;
            const chk = document.getElementById('chk-arc');
            if ((chk && !chk.checked) || isShooting) { hideArcPreview(); return; }
            const m = launchModel(releasePoint(), new THREE.Vector3(HOOP_X, HOOP_Y + 0.05, HOOP_Z));
            const pts = [], dots = [];
            for (let i = 0; i <= 48; i++) pts.push(m.at(m.T * i / 48));
            for (let i = 1; i < 36; i++) dots.push(m.at(m.T * i / 36));
            arcPreview.geometry.setFromPoints(pts);
            arcPreview.computeLineDistances();
            arcDots.geometry.setFromPoints(dots);
            arcPreview.visible = true; arcDots.visible = true;
        }
        function hideArcPreview() { if (arcPreview) { arcPreview.visible = false; arcDots.visible = false; } }
        // The trail is built by sampling the physical model up to the current instant (independent of frame rate)
        function updateTrail(model, t, pos) {
            if (!trailLine) return;
            const pts = [];
            for (let k = 0; k < t; k += 0.035) pts.push(model.at(k));
            pts.push(pos);
            trailLine.geometry.setFromPoints(pts);
            trailDots.geometry.setFromPoints(pts.filter((_, i) => i % 2 === 0));
            trailLine.visible = true; trailDots.visible = true;
        }
        function resetTrail() { if (trailLine) { trailLine.visible = false; trailDots.visible = false; } }
        // TRAYECTORIA>>

        // <<CAMARA
        // Broadcast camera: perpendicular to the shot plane so the parabola is seen from the side.
        // (From behind the shooter the ball rises and falls in the camera's plane and looks like a vertical line.)
        function sideCameraPose() {
            const sx = currentShooterPos.x, sz = currentShooterPos.z;
            const mx = (sx + HOOP_X) / 2, mz = (sz + HOOP_Z) / 2;
            let nx = -(HOOP_Z - sz), nz = (HOOP_X - sx);
            const len = Math.hypot(nx, nz) || 1;
            nx /= len; nz /= len;
            if (nx < 0 || (Math.abs(nx) < 1e-6 && nz < 0)) { nx = -nx; nz = -nz; }   // always the same side, to avoid jumping
            const span = Math.hypot(HOOP_X - sx, HOOP_Z - sz);
            const dist = Math.max(10, span * 1.15 + 4.2);
            return { pos: new THREE.Vector3(mx + nx * dist, 4.6, mz + nz * dist), target: new THREE.Vector3(mx, 2.9, mz) };
        }
        let camAnimId = 0;
        function moveCameraTo(pos, target, ms) {
            const id = ++camAnimId, p0 = camera.position.clone(), t0 = controls.target.clone(), start = performance.now();
            (function step() {
                if (id !== camAnimId) return;                       // another camera animation took over
                const k = Math.min((performance.now() - start) / ms, 1), e = k * k * (3 - 2 * k);
                camera.position.lerpVectors(p0, pos, e);
                controls.target.lerpVectors(t0, target, e);
                if (k < 1) requestAnimationFrame(step);
            })();
        }
        function applySideCamera(ms) {
            const c = sideCameraPose();
            if (ms > 0) moveCameraTo(c.pos, c.target, ms); else { camAnimId++; camera.position.copy(c.pos); controls.target.copy(c.target); }
        }
        // CAMARA>>

        function shootBall() {
            if (isShooting) return;
            isShooting = true;
            document.getElementById('btn-shoot').disabled = true;

            const stintMin = parseFloat(document.getElementById('slider-stint').value);
            const pData = PLAYERS_DATA[activePlayerKey];
            if (cameraModeIndex === 0) applySideCamera(450);   // TV view: the parabola is seen from the side

            // Distance in meters and feet
            const dx = currentShooterPos.x - HOOP_X;
            const dz = currentShooterPos.z - HOOP_Z;
            const distMeters = Math.sqrt(dx * dx + dz * dz);
            const distFeet = distMeters * 3.28084;

            // Probability with the same model as the panel (measured effects)
            const finalProb = computeShotProb().final;
            const isMade = (Math.random() * 100) < finalProb;

            // 1. Player animation: knee bend raising the ball -> jump -> release and follow-through
            playSound('jump');
            let jumpStep = 0;
            const pHeight = pData.heightScale;

            const jumpInterval = setInterval(() => {
                jumpStep += 0.07;
                if (jumpStep <= 0.4) {
                    // Pre-load (knee dip) while the ball rises to the set point
                    const t = jumpStep / 0.4;
                    posePlayer(IDLE_CROUCH + Math.sin(t * Math.PI) * 0.16, t);
                } else if (jumpStep <= 1.0) {
                    // Lift in the air (jump shot); on release, posePlayer does the follow-through
                    playerGroup.position.y = Math.sin((jumpStep - 0.4) * Math.PI / 0.6) * 0.55 * pHeight;
                    posePlayer(0, 1);
                } else {
                    playerGroup.position.y = 0;
                    posePlayer(IDLE_CROUCH, 1);
                    clearInterval(jumpInterval);
                }
            }, 25);

            // 2. Ball trajectory (dynamic 3D parabola from the hands at release)
            let startPos;
            let targetPos;

            if (isMade) {
                targetPos = new THREE.Vector3(HOOP_X, HOOP_Y + 0.05, HOOP_Z);
            } else {
                targetPos = new THREE.Vector3(HOOP_X, HOOP_Y + 0.02, HOOP_Z + RIM_RADIUS);
            }

            // Flight: physical parabola to the hoop (see launchModel). The trail is drawn as the ball advances.
            let model = null, flightStart = 0;

            function animateFlight() {
                const p = Math.min((performance.now() - flightStart) / (model.T * FLIGHT_SLOWMO * 1000), 1.0);
                const pos = model.at(p * model.T);
                basketball.position.copy(pos);
                basketball.rotation.x -= 0.15;
                updateTrail(model, p * model.T, pos);

                if (p < 1.0) {
                    requestAnimationFrame(animateFlight);
                } else {
                    onShotArrival(isMade);
                }
            }

            // Start the ball flight at the top of the jump
            setTimeout(() => {
                ballInHands = false;
                startPos = basketball.position.clone();
                model = launchModel(startPos, targetPos);
                hideArcPreview(); resetTrail();
                flightStart = performance.now();
                requestAnimationFrame(animateFlight);
            }, 180);
        }

        function onShotArrival(isMade) {
            const banner = document.getElementById('result-banner');

            if (isMade) {
                playSound('swish');
                banner.className = 'made';
                banner.textContent = I18N.t('sim.made');

                let netTime = 0;
                const netInterval = setInterval(() => {
                    netTime += 0.2;
                    netMesh.scale.x = 1.0 + Math.sin(netTime * 8) * 0.18;
                    netMesh.scale.z = 1.0 + Math.sin(netTime * 8) * 0.18;
                    if (netTime > 1.2) {
                        netMesh.scale.set(1, 1, 1);
                        clearInterval(netInterval);
                    }
                }, 30);

                animateBallDrop(new THREE.Vector3(HOOP_X, 0.12, HOOP_Z));
            } else {
                playSound('clank');
                banner.className = 'missed';
                banner.textContent = I18N.t('sim.missed');

                const bounceTarget = new THREE.Vector3(
                    HOOP_X + (Math.random() - 0.5) * 1.5,
                    0.12,
                    HOOP_Z + 2.2
                );
                animateBallBounce(bounceTarget);
            }

            setTimeout(() => {
                banner.className = '';
                resetBallToPlayerHands();
                isShooting = false;
                resetTrail(); updateArcPreview();
                document.getElementById('btn-shoot').disabled = false;
            }, 2200);
        }

        function animateBallDrop(groundPos) {
            let dropTime = 0;
            const startY = basketball.position.y;
            const dropInterval = setInterval(() => {
                dropTime += 0.08;
                basketball.position.y = THREE.MathUtils.lerp(startY, groundPos.y, dropTime);
                if (dropTime >= 1.0) {
                    clearInterval(dropInterval);
                }
            }, 25);
        }

        function animateBallBounce(bouncePos) {
            let bounceTime = 0;
            const startP = basketball.position.clone();
            const bounceInterval = setInterval(() => {
                bounceTime += 0.05;
                const progress = Math.min(bounceTime, 1.0);
                basketball.position.x = THREE.MathUtils.lerp(startP.x, bouncePos.x, progress);
                basketball.position.z = THREE.MathUtils.lerp(startP.z, bouncePos.z, progress);
                basketball.position.y = Math.max(0.12, startP.y - progress * 2.8 + Math.sin(progress * Math.PI) * 1.2);
                if (progress >= 1.0) {
                    clearInterval(bounceInterval);
                }
            }, 25);
        }

        // Draggable, collapsible panels
        function toggleCard(cardName) {
            const body = document.getElementById(`${cardName}-body`);
            const btn = document.getElementById(`btn-min-${cardName}`);
            if (body.classList.contains('collapsed')) {
                body.classList.remove('collapsed');
                btn.textContent = '−';
            } else {
                body.classList.add('collapsed');
                btn.textContent = '+';
            }
        }

        function initDraggableCards() {
            makeDraggable(document.getElementById('controls-panel'), document.getElementById('controls-drag-handle'));
            makeDraggable(document.getElementById('metrics-panel'), document.getElementById('metrics-drag-handle'));
        }

        function makeDraggable(element, handle) {
            let posX = 0, posY = 0, initialMouseX = 0, initialMouseY = 0;

            handle.onmousedown = dragMouseDown;
            handle.ontouchstart = dragTouchStart;

            function dragMouseDown(e) {
                e.preventDefault();
                initialMouseX = e.clientX;
                initialMouseY = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e.preventDefault();
                posX = initialMouseX - e.clientX;
                posY = initialMouseY - e.clientY;
                initialMouseX = e.clientX;
                initialMouseY = e.clientY;

                element.style.bottom = 'auto';
                element.style.right = 'auto';
                element.style.top = (element.offsetTop - posY) + 'px';
                element.style.left = (element.offsetLeft - posX) + 'px';
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }

            function dragTouchStart(e) {
                const touch = e.touches[0];
                initialMouseX = touch.clientX;
                initialMouseY = touch.clientY;
                document.ontouchend = closeTouchDrag;
                document.ontouchmove = touchDrag;
            }

            function touchDrag(e) {
                const touch = e.touches[0];
                posX = initialMouseX - touch.clientX;
                posY = initialMouseY - touch.clientY;
                initialMouseX = touch.clientX;
                initialMouseY = touch.clientY;

                element.style.bottom = 'auto';
                element.style.right = 'auto';
                element.style.top = (element.offsetTop - posY) + 'px';
                element.style.left = (element.offsetLeft - posX) + 'px';
            }

            function closeTouchDrag() {
                document.ontouchend = null;
                document.ontouchmove = null;
            }
        }

        // HUD and metrics
        function onStintSliderChange(val) {
            const stintMin = parseFloat(val);
            document.getElementById('slider-stint-val').textContent = `${stintMin.toFixed(1)} min`;

            const mins = Math.floor(stintMin);
            const secs = Math.round((stintMin - mins) * 60);
            const clockStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            const clockEl = document.getElementById('hud-clock');
            clockEl.textContent = clockStr;

            const statusEl = document.getElementById('hud-status');
            const deltaEl = document.getElementById('hud-delta');

            clockEl.className = 'hud-clock';
            statusEl.className = 'hud-badge';

            if (stintMin < 4.0) {
                clockEl.classList.remove('warning', 'critical');
                statusEl.classList.remove('warning', 'critical');
                statusEl.textContent = I18N.t('sim.st.rested');
                deltaEl.textContent = "0.0 pp (base)";
                deltaEl.style.color = "#10B981";
            } else if (stintMin < 8.0) {
                clockEl.classList.add('warning');
                statusEl.classList.add('warning');
                statusEl.textContent = I18N.t('sim.st.mid');
                deltaEl.textContent = `${(-fatigueDropFor(stintMin)).toFixed(2)} pp`;
                deltaEl.style.color = "#F59E0B";
            } else {
                clockEl.classList.add('critical');
                statusEl.classList.add('critical');
                statusEl.textContent = I18N.t('sim.st.long');
                deltaEl.textContent = `${(-fatigueDropFor(stintMin)).toFixed(2)} pp`;
                deltaEl.style.color = "#EF4444";
            }

            updatePredictiveStats();
        }

        function updatePredictiveStats() {
            const stintMin = parseFloat(document.getElementById('slider-stint').value);
            const m = computeShotProb();
            const f = (v) => (v >= 0 ? '+' : '') + v.toFixed(1);
            document.getElementById('metric-base-xshot').textContent = `${m.base.toFixed(1)}%`;
            document.getElementById('metric-dist-adj').textContent = `${f(m.da)} pp`;
            document.getElementById('metric-def-ft').textContent = DEF.mainDef.toFixed(1);
            const typEl = document.getElementById('metric-def-typ'); if (typEl) typEl.textContent = DEF.contest ? I18N.t('sim.typical', { x: m.typ.toFixed(1) }) : '';
            document.getElementById('metric-contest').textContent = `${f(m.ca.adj)} pp`;
            document.getElementById('metric-contest-ci').textContent = DEF.contest ? `(${f(m.ca.lo)} ${I18N.t('sim.to')} ${f(m.ca.hi)})` : '';
            document.getElementById('metric-team').textContent = DEF.team ? `${f(m.ta.adj)} pp` : '0.0 pp';
            document.getElementById('metric-team-ci').textContent = DEF.team ? `(${f(m.ta.lo)} ${I18N.t('sim.to')} ${f(m.ta.hi)})` : I18N.t('sim.league');
            const minsEffect = m.cold - m.fatigueDrop;
            document.getElementById('metric-penalty').textContent = `${f(minsEffect)} pp`;
            const hud = document.getElementById('hud-delta');
            if (hud) { hud.textContent = `${f(minsEffect)} pp`; hud.style.color = minsEffect < -0.05 ? '#EF4444' : '#10B981'; }
            document.getElementById('metric-final-prob').textContent = `${m.final.toFixed(1)}%`;
            renderWeights(m);

            const fatiguePct = Math.min(100, Math.round((stintMin / 12.0) * 100));
            document.getElementById('metric-fatigue-pct').textContent = `${fatiguePct}%`;
            document.getElementById('gauge-bar').style.width = `${fatiguePct}%`;

            if (fatiguePct > 65) {
                document.getElementById('gauge-bar').style.background = "linear-gradient(90deg, #F59E0B, #EF4444)";
            } else {
                document.getElementById('gauge-bar').style.background = "linear-gradient(90deg, #10B981, #F59E0B)";
            }
        }

        // Contribution of each measured term (pp vs. the player's base accuracy): makes the size of fatigue comparable
        function renderWeights(m) {
            const rows = [
                ['sim.w.shot', m.da], ['sim.w.def', m.ca.adj], ['sim.w.rival', m.ta.adj],
                ['sim.w.cold', m.cold], ['sim.w.fat', -m.fatigueDrop, 'fat']
            ];
            const scale = Math.max(5, ...rows.map((r) => Math.abs(r[1])));
            document.getElementById('weights').innerHTML =
                `<div class="w-title">${I18N.t('sim.w.title')}</div>` +
                rows.map(([k, v, cls]) => {
                    const w = Math.abs(v) / scale * 50;
                    const pos = v >= 0 ? `left:50%;width:${w}%` : `left:${50 - w}%;width:${w}%`;
                    return `<div class="w-row ${cls || ''}"><span>${I18N.t(k)}</span><div class="w-track"><div class="w-bar" style="${pos};background:${v >= 0 ? '#10B981' : '#EF4444'}"></div></div>` +
                        `<span class="w-v">${(v >= 0 ? '+' : '') + v.toFixed(1)}</span></div>`;
                }).join('') +
                `<div class="w-note">${I18N.t('sim.w.note')}</div>`;
        }

        function resetStint() {
            document.getElementById('slider-stint').value = 1.0;
            onStintSliderChange(1.0);
        }

        const CAM_KEYS = ['sim.cam.tv', 'sim.cam.shooter', 'sim.cam.rim', 'sim.cam.free'];
        function updateCameraLabel() {
            const btn = document.getElementById('btn-camera');
            if (btn) btn.innerHTML = '<svg class="ic" aria-hidden="true"><use href="#i-camera"/></svg> ' + I18N.t(CAM_KEYS[cameraModeIndex]);
        }
        function cycleCamera() {
            cameraModeIndex = (cameraModeIndex + 1) % 4;
            updateCameraLabel();

            if (cameraModeIndex === 0) {
                applySideCamera(450);
            } else if (cameraModeIndex === 1) {
                const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(playerGroup.quaternion);
                camera.position.copy(playerGroup.position).add(new THREE.Vector3(0, 2.2, 0)).sub(forward.multiplyScalar(2.6));
                controls.target.set(HOOP_X, HOOP_Y, HOOP_Z);
            } else if (cameraModeIndex === 2) {
                camera.position.set(0, 4.8, -4.2);
                controls.target.set(HOOP_X, HOOP_Y, HOOP_Z);
            } else {
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = () => {
            I18N.apply();
            initScene();
            animate();
            updateCameraLabel();
            onStintSliderChange(2.5);
            document.querySelectorAll('#lang-switch button').forEach((b) => b.addEventListener('click', () => I18N.set(b.dataset.lang)));
            I18N.onChange(() => {
                updateFatigueNote(); updateDefNote(); updateCameraLabel();
                onStintSliderChange(document.getElementById('slider-stint').value);
            });
        };
        loadRealData();
        loadDefenseData();
    </script>
