<!DOCTYPE html>
<html lang="en" data-title-key="sim.doc.title">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourtFatigue 3D | NBA Shooting and Fatigue Simulator</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="../js/i18n.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #080B12;
            color: #F8FAFC;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: crosshair;
        }

        /* Floating hint over the court */
        .court-hint {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(8px);
            border: 1px dashed rgba(56, 189, 248, 0.4);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #38BDF8;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Top HUD: digital fatigue scoreboard */
        .hud-header {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 15px;
            align-items: center;
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 8px 22px;
            border-radius: 40px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            max-width: 90vw;
        }

        .hud-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hud-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #94A3B8;
            font-weight: 600;
        }

        .hud-clock {
            font-family: 'Orbitron', monospace;
            font-size: 1.55rem;
            font-weight: 900;
            color: #10B981;
            letter-spacing: 0.05em;
            text-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
            transition: color 0.3s ease;
        }

        .hud-clock.warning {
            color: #F59E0B;
            text-shadow: 0 0 12px rgba(245, 158, 11, 0.5);
        }

        .hud-clock.critical {
            color: #EF4444;
            text-shadow: 0 0 18px rgba(239, 68, 68, 0.8);
            animation: pulse-glow 1s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); }
            100% { transform: scale(1.03); }
        }

        .hud-badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            text-transform: uppercase;
            background: rgba(16, 185, 129, 0.2);
            color: #10B981;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .hud-badge.warning {
            background: rgba(245, 158, 11, 0.2);
            color: #F59E0B;
            border-color: rgba(245, 158, 11, 0.4);
        }

        .hud-badge.critical {
            background: rgba(239, 68, 68, 0.2);
            color: #EF4444;
            border-color: rgba(239, 68, 68, 0.4);
        }

        .hud-divider {
            width: 1px;
            height: 28px;
            background: rgba(255, 255, 255, 0.12);
        }

        /* Camera tools, top right */
        .camera-tools {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
            display: flex;
            gap: 8px;
        }

        .btn-tool {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #F8FAFC;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.2s;
        }

        .btn-tool:hover {
            background: rgba(30, 41, 59, 0.95);
            border-color: #38BDF8;
        }

        /* Draggable, collapsible floating cards */
        .floating-card {
            position: absolute;
            z-index: 10;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            transition: box-shadow 0.2s ease, opacity 0.2s ease;
        }

        .card-header {
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: grab;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(30, 41, 59, 0.4);
            border-radius: 16px 16px 0 0;
        }

        .card-header:active {
            cursor: grabbing;
        }

        .card-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: #F8FAFC;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-btn-min {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #94A3B8;
            width: 22px;
            height: 22px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 700;
            transition: all 0.2s;
        }

        .card-btn-min:hover {
            background: #38BDF8;
            color: #0F172A;
        }

        .card-body {
            padding: 12px 14px;
            transition: all 0.25s ease;
        }

        .card-body.collapsed {
            display: none;
        }

        /* Initial position of the controls (left) */
        #controls-panel {
            bottom: 15px;
            left: 15px;
            width: 300px;
        }

        /* Initial position of the metrics (right) */
        #metrics-panel {
            bottom: 15px;
            right: 15px;
            width: 280px;
        }

        .control-group {
            margin-bottom: 10px;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: #94A3B8;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .control-val {
            color: #38BDF8;
            font-weight: 700;
        }

        select, input[type="range"] {
            width: 100%;
        }

        select {
            background: #1E293B;
            border: 1px solid #334155;
            color: #F8FAFC;
            padding: 6px 10px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.82rem;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: #38BDF8;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: #334155;
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #38BDF8;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
            transition: transform 0.1s;
        }

        /* Shoot button */
        .btn-shoot {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            cursor: pointer;
            box-shadow: 0 5px 18px rgba(37, 99, 235, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        .btn-shoot:hover:not(:disabled) {
            background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(37, 99, 235, 0.6);
        }

        .btn-shoot:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Metrics */
        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 7px;
            font-size: 0.8rem;
        }

        .metric-row:last-child {
            margin-bottom: 0;
            padding-top: 7px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .gauge-bar-bg {
            width: 100%;
            height: 7px;
            background: #334155;
            border-radius: 4px;
            overflow: hidden;
            margin: 5px 0 7px 0;
        }

        .gauge-bar-fill {
            height: 100%;
            width: 25%;
            background: linear-gradient(90deg, #10B981, #F59E0B);
            border-radius: 4px;
            transition: width 0.3s ease, background 0.3s ease;
        }

        /* Made / missed banner */
        #result-banner {
            position: absolute;
            top: 115px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            opacity: 0;
            z-index: 20;
            font-family: 'Orbitron', monospace;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            padding: 10px 28px;
            border-radius: 14px;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }

        #result-banner.made {
            background: rgba(16, 185, 129, 0.9);
            color: #FFFFFF;
            border: 2px solid #34D399;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.8);
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        #result-banner.missed {
            background: rgba(239, 68, 68, 0.9);
            color: #FFFFFF;
            border: 2px solid #F87171;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.8);
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Responsive layout */
        @media (max-width: 820px) {
            #controls-panel {
                bottom: 10px;
                left: 10px;
                width: calc(52% - 14px);
                max-width: 280px;
            }
            #metrics-panel {
                bottom: 10px;
                right: 10px;
                width: calc(48% - 14px);
                max-width: 260px;
            }
            .hud-header {
                padding: 6px 14px;
                gap: 10px;
                top: 8px;
            }
            .hud-clock {
                font-size: 1.25rem;
            }
        }
            .chk { display:flex; gap:8px; align-items:flex-start; font-size:.7rem; color:#94A3B8; margin:2px 0 12px; line-height:1.3; cursor:pointer; }
        .chk input { margin-top:2px; accent-color:#7EA4E6; }
        .metric-row .ci { font-size:.62rem; color:#94A3B8; font-weight:500; margin-left:4px; }
        /* "What weighs most": one diverging bar per term, centred on 0 */
        #weights { margin-top:10px; padding-top:8px; border-top:1px solid rgba(148,163,184,.25); }
        #weights .w-title { font-size:.72rem; font-weight:700; color:#F8FAFC; margin-bottom:6px; }
        #weights .w-row { display:grid; grid-template-columns:78px 1fr 46px; align-items:center; gap:6px; font-size:.66rem; color:#94A3B8; margin:3px 0; }
        #weights .w-track { position:relative; height:9px; background:rgba(148,163,184,.12); border-radius:3px; }
        #weights .w-track::after { content:""; position:absolute; left:50%; top:-2px; bottom:-2px; width:1px; background:#94A3B8; }
        #weights .w-bar { position:absolute; top:0; bottom:0; border-radius:3px; transition:all .25s; }
        #weights .w-row.fat { color:#F8FAFC; font-weight:700; }
        #weights .w-v { text-align:right; font-weight:700; color:#F8FAFC; }
        #weights .w-note { font-size:.6rem; color:#94A3B8; margin-top:5px; line-height:1.35; }
        /* Icons and language switch */
        .ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; flex: none; }
        .lang-sim { display: flex; gap: 2px; padding: 3px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; }
        .lang-sim button { background: transparent; border: 0; color: #94A3B8; font-size: .72rem; font-weight: 700; padding: 5px 9px; border-radius: 16px; cursor: pointer; }
        .lang-sim button.on { background: #7EA4E6; color: #010F2E; }
        .card-title .ic { margin-right: 6px; color: #7EA4E6; }
        a.btn-tool { text-decoration: none; }
    </style>
</head>
<body>

    <!-- Icon sprite -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
        <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></symbol>
        <symbol id="i-camera" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></symbol>
        <symbol id="i-ball" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2v20M5 4.5c4 3 4 12 0 15M19 4.5c-4 3-4 12 0 15"/></symbol>
        <symbol id="i-chart" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></symbol>
        <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></symbol>
        <symbol id="i-back" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></symbol>
    </defs></svg>

    <!-- Three.js canvas -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Click hint -->
    <div class="court-hint">
        <svg class="ic" aria-hidden="true"><use href="#i-target"/></svg> <span data-i18n="sim.hint"></span>
    </div>

    <!-- Top HUD -->
    <div class="hud-header" id="hud-header">
        <div class="hud-item">
            <span class="hud-label" data-i18n="sim.hud.stint"></span>
            <div id="hud-clock" class="hud-clock">02:30</div>
        </div>
        <div class="hud-divider"></div>
        <div class="hud-item">
            <span class="hud-label" data-i18n="sim.hud.status"></span>
            <div id="hud-status" class="hud-badge">RESTED</div>
        </div>
        <div class="hud-divider"></div>
        <div class="hud-item">
            <span class="hud-label" data-i18n="sim.hud.fatigue"></span>
            <div id="hud-delta" style="font-weight: 700; color: #10B981; font-size: 1rem;">0.0 pp</div>
            <select id="fatigue-scenario" style="margin-top:4px;background:#0B0F19;color:#E5E7EB;border:1px solid #334155;border-radius:6px;font-size:.7rem;padding:2px 4px;"><option value="central" data-i18n="sim.scn.data"></option><option value="pessimistic" data-i18n="sim.scn.pess"></option></select>
            <div id="fatigue-note" style="font-size:.62rem;color:#94A3B8;max-width:220px;margin-top:3px;"></div>
        </div>
    </div>

    <!-- Animated made / missed banner -->
    <div id="result-banner">SWISH</div>

    <!-- Camera tools, top right -->
    <div class="camera-tools">
        <a class="btn-tool" href="../index.html"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg><span data-i18n="sim.back"></span></a>
        <button id="btn-camera" class="btn-tool" onclick="cycleCamera()"></button>
        <button id="btn-reset-stint" class="btn-tool" onclick="resetStint()"><svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg><span data-i18n="sim.reset"></span></button>
        <div class="lang-sim" id="lang-switch" role="group" aria-label="Language">
            <button data-lang="en" class="on">EN</button><button data-lang="es">ES</button>
        </div>
    </div>

    <!-- Draggable, collapsible control panel (left) -->
    <div class="floating-card" id="controls-panel">
        <div class="card-header" id="controls-drag-handle">
            <div class="card-title">
                <svg class="ic" aria-hidden="true"><use href="#i-ball"/></svg><span data-i18n="sim.controls"></span>
            </div>
            <button class="card-btn-min" id="btn-min-controls" onclick="toggleCard('controls')" data-i18n-title="sim.min.title">−</button>
        </div>

        <div class="card-body" id="controls-body">
            <div class="control-group">
                <div class="control-label">
                    <span data-i18n="sim.player"></span>
                </div>
                <select id="select-player" onchange="onPlayerChanged()">
                    <option value="Curry">Stephen Curry (GSW #30)</option>
                    <option value="Tatum">Jayson Tatum (BOS #0)</option>
                    <option value="LeBron">LeBron James (LAL #23)</option>
                    <option value="Doncic">Luka Dončić (DAL #77)</option>
                    <option value="Young">Trae Young (ATL #11)</option>
                    <option value="Jokic">Nikola Jokić (DEN #15)</option>
                </select>
            </div>

            <div class="control-group">
                <div class="control-label">
                    <span data-i18n="sim.zone"></span>
                </div>
                <select id="select-shot-zone" onchange="onZoneSelectChanged()">
                    <option value="top3" data-i18n="sim.z.top3"></option>
                    <option value="corner3_r" data-i18n="sim.z.corner3_r"></option>
                    <option value="corner3_l" data-i18n="sim.z.corner3_l"></option>
                    <option value="wing3" data-i18n="sim.z.wing3"></option>
                    <option value="midrange" data-i18n="sim.z.midrange"></option>
                    <option value="freethrow" data-i18n="sim.z.freethrow"></option>
                    <option value="paint" data-i18n="sim.z.paint"></option>
                </select>
            </div>

            <div class="control-group">
                <div class="control-label">
                    <span data-i18n="sim.stint"></span>
                    <span id="slider-stint-val" class="control-val">2.5 min</span>
                </div>
                <input type="range" id="slider-stint" min="0" max="12.0" step="0.5" value="2.5" oninput="onStintSliderChange(this.value)">
            </div>

            <div class="control-group">
                <div class="control-label">
                    <span data-i18n="sim.rival"></span>
                </div>
                <select id="select-rival" onchange="onRivalChanged()">
                    <option value="" data-i18n="sim.rival.avg"></option>
                </select>
            </div>

            <div class="control-group">
                <div class="control-label">
                    <span data-i18n-title="sim.defdist.tip" data-i18n="sim.defdist"></span>
                    <span id="slider-def-val" class="control-val">4.0 ft</span>
                </div>
                <input type="range" id="slider-def" min="1.5" max="8" step="0.5" value="4" oninput="onDefenderChanged(this.value)">
                <label class="chk" style="margin-top:6px;"><input type="checkbox" id="chk-typical" checked onchange="onTypicalToggled(this.checked)"><span data-i18n="sim.typical.chk"></span></label>
            </div>

            <label class="chk"><input type="checkbox" id="chk-defenders" checked onchange="toggleDefenders(this.checked)">
                <span data-i18n="sim.defs.chk"></span></label>

            <label class="chk"><input type="checkbox" id="chk-arc" checked onchange="updateArcPreview()">
                <span data-i18n="sim.arc.chk"></span></label>

            <button id="btn-shoot" class="btn-shoot" onclick="shootBall()">
                <svg class="ic" aria-hidden="true"><use href="#i-ball"/></svg> <span data-i18n="sim.shoot"></span>
            </button>
        </div>
    </div>

    <!-- Draggable, collapsible metrics panel (right) -->
    <div class="floating-card" id="metrics-panel">
        <div class="card-header" id="metrics-drag-handle">
            <div class="card-title">
                <svg class="ic" aria-hidden="true"><use href="#i-chart"/></svg><span data-i18n="sim.pred"></span>
            </div>
            <button class="card-btn-min" id="btn-min-metrics" onclick="toggleCard('metrics')" data-i18n-title="sim.min.title">−</button>
        </div>

        <div class="card-body" id="metrics-body">
            <div class="metric-row">
                <span style="color:#94A3B8;" data-i18n="sim.m.dist"></span>
                <span id="metric-distance" style="font-weight:700; color:#38BDF8;">25.0 ft</span>
            </div>
            <div class="metric-row">
                <span style="color:#94A3B8;" data-i18n="sim.m.fatigue"></span>
                <span id="metric-fatigue-pct" style="font-weight:700; color:#10B981;">20%</span>
            </div>
            <div class="gauge-bar-bg">
                <div id="gauge-bar" class="gauge-bar-fill"></div>
            </div>

            <div class="metric-row">
                <span style="color:#94A3B8;" data-i18n="sim.m.base"></span>
                <span id="metric-base-xshot" style="font-weight:700;">48.5%</span>
            </div>
            <div class="metric-row">
                <span style="color:#94A3B8;" data-i18n="sim.m.shotdist"></span>
                <span id="metric-dist-adj" style="font-weight:700;">0.0 pp</span>
            </div>
            <div class="metric-row">
